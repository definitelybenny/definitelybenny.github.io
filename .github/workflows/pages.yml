# Builds definitelybenny.dev from the repos tagged "showcase" and publishes it to GitHub Pages.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
name: Build and publish the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *" # every 6 hours, so newly tagged or edited repos show up on their own
  workflow_dispatch: # "Run workflow" button, to pick up a change right away
  pull_request: # checks the build against the sample files in showcase-files/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pillow

      - name: Build from the sample files (pull requests)
        if: github.event_name == 'pull_request'
        run: python3 scripts/build.py --local showcase-files --strict

      - name: Build from the repos tagged showcase
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
